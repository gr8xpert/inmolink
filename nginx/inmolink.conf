# Inmolink nginx config — production single-VPS deployment.
#
# Replace `inmolink.example` with the real domain when DNS is configured.
# TLS certs are expected at /etc/letsencrypt/live/<domain>/ (certbot) or
# Cloudflare origin cert at /etc/cloudflare/origin-cert.pem (recommended
# when proxying through Cloudflare per PLAN §2.2).
#
# Three vhosts:
#   inmolink.example       → public marketplace (port 3002)
#   app.inmolink.example   → agent dashboard    (port 3000)
#   api.inmolink.example   → API + WebSocket    (port 3001)

# ============================================================================
# Global hardening
# ============================================================================

# Rate-limit zones (per-IP). Per PLAN §8 / §11.4:
#   /search:               60/min     -> use $rl_search
#   /property/*:           120/min    -> use $rl_property
#   /api/public/leads:      5/min     -> use $rl_lead
limit_req_zone $binary_remote_addr zone=rl_search:10m   rate=60r/m;
limit_req_zone $binary_remote_addr zone=rl_property:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=rl_lead:10m     rate=5r/m;
limit_req_zone $binary_remote_addr zone=rl_default:10m  rate=300r/m;

# WebSocket upgrade map for Socket.io
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Trust Cloudflare's CF-Connecting-IP so the app sees the real client IP
# instead of the CF edge IP. CRITICAL: only trust this header from CF
# ranges — otherwise any client can spoof their IP by sending the header.
#
# Cloudflare publishes the current list at:
#   https://www.cloudflare.com/ips-v4 / https://www.cloudflare.com/ips-v6
# Refresh weekly via cron:
#   curl -s https://www.cloudflare.com/ips-v4 | \
#     awk '{print "set_real_ip_from " $1 ";"}' > /etc/nginx/conf.d/cloudflare-ips.conf
#   curl -s https://www.cloudflare.com/ips-v6 | \
#     awk '{print "set_real_ip_from " $1 ";"}' >> /etc/nginx/conf.d/cloudflare-ips.conf
#   nginx -t && systemctl reload nginx
include /etc/nginx/conf.d/cloudflare-ips.conf;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Brotli compression (PLAN §11.4) — requires nginx-mod-brotli.
# brotli on;
# brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
# brotli_comp_level 4;

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
gzip_min_length 1024;
gzip_proxied any;

# ============================================================================
# Public marketplace (apps/public — anonymous, ISR-heavy)
# ============================================================================

server {
  listen 80;
  server_name inmolink.example;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name inmolink.example;

  ssl_certificate     /etc/letsencrypt/live/inmolink.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/inmolink.example/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # HSTS — only enable after testing, hard to undo
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 5m; # large uploads go direct to R2

  # Per-route rate limits (PLAN §11.4)
  location ~ ^/[a-z]{2}/search { limit_req zone=rl_search burst=20 nodelay; proxy_pass http://127.0.0.1:3002; include /etc/nginx/conf.d/_proxy.conf; }
  location ~ ^/[a-z]{2}/property/ { limit_req zone=rl_property burst=40 nodelay; proxy_pass http://127.0.0.1:3002; include /etc/nginx/conf.d/_proxy.conf; }
  # Actual route is /api/public/leads (see apps/api/src/modules/public/lead-routes.ts)
  location = /api/public/leads { limit_req zone=rl_lead burst=2 nodelay; proxy_pass http://127.0.0.1:3001; include /etc/nginx/conf.d/_proxy.conf; }

  location / {
    limit_req zone=rl_default burst=100 nodelay;
    proxy_pass http://127.0.0.1:3002;
    include /etc/nginx/conf.d/_proxy.conf;
  }
}

# ============================================================================
# Agent dashboard (apps/web — auth-required)
# ============================================================================

server {
  listen 80;
  server_name app.inmolink.example;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name app.inmolink.example;

  ssl_certificate     /etc/letsencrypt/live/app.inmolink.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.inmolink.example/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Robots-Tag "noindex, nofollow" always; # Dashboard not indexed (PLAN §8)

  client_max_body_size 5m;

  location / {
    limit_req zone=rl_default burst=100 nodelay;
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/conf.d/_proxy.conf;
  }
}

# ============================================================================
# API + WebSocket (apps/api — Fastify + Socket.io with sticky sessions)
# ============================================================================

# Upstream with ip_hash for Socket.io session affinity (PLAN §11.8).
# When we scale to multiple api processes this becomes meaningful.
upstream inmolink_api {
  ip_hash;
  server 127.0.0.1:3001;
  # server 127.0.0.1:3011;  # uncomment when adding more api instances
}

server {
  listen 80;
  server_name api.inmolink.example;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name api.inmolink.example;

  ssl_certificate     /etc/letsencrypt/live/api.inmolink.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.inmolink.example/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Larger limit for chat attachments / ticket uploads (10MB cap per file)
  client_max_body_size 12m;

  location / {
    limit_req zone=rl_default burst=200 nodelay;
    proxy_pass http://inmolink_api;
    include /etc/nginx/conf.d/_proxy.conf;

    # WebSocket upgrade for Socket.io
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }
}
