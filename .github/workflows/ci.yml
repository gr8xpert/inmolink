name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref when a new commit lands
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-typecheck:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (required for typecheck)
        run: pnpm --filter @inmolink/db prisma generate

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  prisma-validate:
    name: Prisma schema validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @inmolink/db prisma validate

      - name: Format Prisma schema (drift check)
        run: pnpm --filter @inmolink/db prisma format --check
        continue-on-error: false

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inmolink
          POSTGRES_PASSWORD: inmolink
          POSTGRES_DB: inmolink_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inmolink"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://inmolink:inmolink@localhost:5432/inmolink_test
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @inmolink/db prisma generate

      - name: Run tests
        run: pnpm test

  build:
    name: Build all apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, prisma-validate]
    env:
      # Build-time env stubs — real values set in deploy environment.
      DATABASE_URL: postgresql://stub:stub@localhost:5432/stub
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-stub-secret-not-used-at-runtime-32chars
      ENCRYPTION_KEY: ci-stub-32-char-key-aaaaaaaaaaaaaa
      NEXT_PUBLIC_API_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @inmolink/db prisma generate

      - name: Build
        run: pnpm build

      - name: Upload bundle stats (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: |
            apps/web/.next/analyze
            apps/public/.next/analyze
          if-no-files-found: ignore
          retention-days: 7
